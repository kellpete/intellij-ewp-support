group = com.github.kellpete.intellijewpsupport
version = 0.0.6

pluginRepositoryUrl = https://github.com/kellpete/intellij-ewp-support

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# This workaround is needed to fix build for local development, but it fails the build on github
# Instead of setting it here, put the setting into: "C:\Users\<username>\.gradle\gradle.properties"
#org.gradle.jvmargs = -Djavax.net.ssl.trustStoreType=Windows-ROOT
